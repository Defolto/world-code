# Координаты: [x, y], начало в левом верхнем углу, y растёт вниз.
id: start-10
lesson: 1
title: Длинные коридоры
brief: >-
  Коридоры здесь длинные: семь клеток вправо, потом вниз, потом семь
  обратно. Писать по строке на шаг — долго. В скобках команды можно
  указать число: hero.move_right(3) — три шага вправо одной строкой.
  Проведи героя к флагу тремя строками.

map:
  legend:
    "#": wall
    ".": floor
    "@": hero
    "F": flag
  grid: |
    ##########
    #@.......#
    ########.#
    #F.......#
    ##########

api:
  - hero.move_right
  - hero.move_left
  - hero.move_up
  - hero.move_down
  - hero.wait

starter: |
  # Число в скобках — сколько шагов сделать
  hero.move_right(3)

solution: |
  hero.move_right(7)
  hero.move_down(2)
  hero.move_left(7)

goals:
  - reach: [1, 3]

medals:
  short: auto

hints:
  - after_fails: 1
    text: >-
      Посчитай клетки коридора и напиши это число в скобках:
      hero.move_right(7) проведёт по всему верхнему коридору.
  - after_fails: 2
    text: >-
      Герой упёрся в стену раньше времени или не дошёл? Значит, число в
      скобках не совпало с длиной коридора. Считай клетки от той, где
      стоит герой, до последней перед стеной.
  - after_fails: 4
    text: >-
      hero.move_right(7), потом hero.move_down(2), потом hero.move_left(7).
