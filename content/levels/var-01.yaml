# Координаты: [x, y], начало в левом верхнем углу, y растёт вниз.
id: var-01
lesson: 3
title: Два пароля
brief: >-
  Две двери, у каждой свой пароль: первая открывается словом **сезам**,
  вторая — словом **фонарь**. Слова герой хранит в переменных. В заготовке
  первая уже сделана: password = "сезам" создаёт переменную password и
  кладёт в неё слово (слово в кавычках, имя переменной — без). У двери
  герой говорит слово из переменной — hero.say(password), и дверь
  открывается. Сделай так же для второй двери: своя переменная с другим
  именем, в ней слово фонарь, и hero.say с этим именем у второй двери.

map:
  legend:
    "#": wall
    ".": floor
    "@": hero
    "D": door
    "G": gate2
    "F": flag
  grid: |
    ###########
    #@..D...GF#
    ###########

objects:
  door:
    password: сезам
  gate2:
    password: фонарь

api:
  - hero.move_right
  - hero.say

starter: |
  # Переменная: имя = "слово". Первая дверь уже сделана, вторая — твоя
  password = "сезам"
  hero.move_right(2)
  hero.say(password)

solution: |
  password = "сезам"
  hero.move_right(2)
  hero.say(password)
  hero.move_right(4)
  password2 = "фонарь"
  hero.say(password2)
  hero.move_right(2)

goals:
  - reach: [9, 1]

medals:
  short: auto

hints:
  - after_fails: 1
    text: >-
      Посмотри на первые строки: password = "сезам" — это переменная,
      а hero.say(password) — слово из неё. Для второй двери повтори то же
      с другим именем, например password2, и словом фонарь в кавычках.
  - after_fails: 2
    text: >-
      Слово — в кавычках, имя переменной — без: password2 = "фонарь", а
      потом hero.say(password2) без кавычек. Если сказать hero.say(password)
      у второй двери, герой скажет «сезам», а ей нужен «фонарь». В панели
      «Переменные» видно, что в какой переменной лежит.
  - after_fails: 4
    text: >-
      Четыре шага вправо, password2 = "фонарь", hero.say(password2),
      два шага вправо.
