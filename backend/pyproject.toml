[tool.pytest.ini_options]
# Чтобы `pytest` находил пакет app из корня backend/, без установки в venv
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# Бэкенд живёт на сервере с 3.14, но разрабатываем и на более старых —
# ставим нижнюю границу, чтобы линтер ловил слишком свежий синтаксис.
#
# Симулятор мира (simulator/ в корне) линтуется отдельно, своим
# pyproject.toml в корне репозитория.
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
