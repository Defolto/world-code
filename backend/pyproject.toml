[tool.pytest.ini_options]
# Чтобы `pytest` находил пакет app из корня backend/, без установки в venv
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# Бэкенд живёт на сервере с 3.14, но разрабатываем и на более старых —
# ставим нижнюю границу, чтобы линтер ловил слишком свежий синтаксис.
#
# ВНИМАНИЕ: для симулятора мира граница будет другой и более строгой —
# его нижняя планка задаётся версией Python внутри Pyodide. Когда появится
# пакет simulator/, у него будет свой target-version.
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
